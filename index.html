  <body class="min-h-screen flex flex-col justify-center items-center px-4 pb-32">
    <main class="container mx-auto text-center">
      <section aria-labelledby="clock-heading">
        <h1 id="clock-heading" class="text-4xl font-bold mt-4">Real-time UTC Date</h1>
        <p id="current-date" class="text-lg mt-4" aria-live="polite"></p>
        <p id="epoch-time" class="text-lg mt-2"></p>
        <p id="epoch-binary" class="text-lg mt-2 break-words"></p>
      </section>
      <section class="mt-8" aria-labelledby="countdown-heading">
        <h2 id="countdown-heading" class="text-2xl font-bold">
          Remaining time until the
          <a class="underline hover:no-underline" href="https://en.wikipedia.org/wiki/Year_2038_problem" rel="noopener noreferrer">Year 2038 problem</a>
        </h2>
        <p id="remaining-time" class="text-lg mt-2" aria-live="polite"></p>
      </section>
      <noscript>
        <p class="text-lg mt-8">JavaScript is required to show the live countdown.</p>
      </noscript>
    </main>

    <script>
      const targetDate = new Date(Date.UTC(2038, 0, 19, 3, 14, 7));

      function pluralize(value, unit) {
        return `${value} ${unit}${value === 1 ? '' : 's'}`;
      }

      function getRemainingTimeParts(currentDate) {
        if (currentDate >= targetDate) {
          return null;
        }

        let years = targetDate.getUTCFullYear() - currentDate.getUTCFullYear();
        let months = targetDate.getUTCMonth() - currentDate.getUTCMonth();
        let days = targetDate.getUTCDate() - currentDate.getUTCDate();
        let hours = targetDate.getUTCHours() - currentDate.getUTCHours();
        let minutes = targetDate.getUTCMinutes() - currentDate.getUTCMinutes();
        let seconds = targetDate.getUTCSeconds() - currentDate.getUTCSeconds();

        if (seconds < 0) { seconds += 60; minutes--; }
        if (minutes < 0) { minutes += 60; hours--; }
        if (hours < 0) { hours += 24; days--; }
        if (days < 0) {
          const previousMonth = new Date(Date.UTC(currentDate.getUTCFullYear(), currentDate.getUTCMonth() + months + 1, 0));
          days += previousMonth.getUTCDate();
          months--;
        }
        if (months < 0) { months += 12; years--; }

        return { years, months, days, hours, minutes, seconds };
      }

      function formatRemainingTime(parts) {
        if (!parts) {
          return 'The Year 2038 problem threshold has passed.';
        }

        return [
          pluralize(parts.years, 'year'),
          pluralize(parts.months, 'month'),
          pluralize(parts.days, 'day'),
          pluralize(parts.hours, 'hour'),
          pluralize(parts.minutes, 'minute'),
          pluralize(parts.seconds, 'second'),
        ].join(', ');
      }

      function updateDate() {
        const currentDate = new Date();
        const utcDate = currentDate.toISOString().slice(0, 19).replace('T', ' ');
        const epochTime = Math.floor(currentDate.getTime() / 1000);
        const binaryString = epochTime.toString(2).padStart(32, '0');
        const binaryChunks = binaryString.match(/.{1,8}/g);

        document.getElementById("current-date").textContent = `Date: ${utcDate}`;
        document.getElementById("epoch-time").textContent = `Epoch Time: ${epochTime}`;
        document.getElementById("epoch-binary").textContent = `Binary: ${binaryChunks.join(' ')}`;
        document.getElementById("remaining-time").textContent = formatRemainingTime(getRemainingTimeParts(currentDate));
      }

      document.getElementById("copyright-year").textContent = new Date().getUTCFullYear();
      updateDate();
      setInterval(updateDate, 1000);
    </script>
